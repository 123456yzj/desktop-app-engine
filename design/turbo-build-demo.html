<dialog id="settingsDialog" aria-labelledby="settingsTitle"><form id="settingsForm"><div class="modal-head"><h2 id="settingsTitle">连接设置</h2><button type="button" class="btn btn-subtle icon-btn" data-close="settingsDialog" aria-label="关闭连接设置"><svg><use href="#i-close"/></svg></button></div><div class="modal-body"><label class="form-field">SSH 地址 / 配置别名<input id="hostInput" required pattern="[^\s]+" placeholder="user@host"></label><label class="form-field">Turbo 工作区根目录<input id="rootInput" required pattern="/.*" placeholder="/path/to/workspace/"></label></div><div class="modal-footer"><button class="btn" type="button" data-close="settingsDialog">取消</button><button class="btn btn-primary" type="submit">保存并扫描</button></div></form></dialog>

<script>
'use strict';
const $=id=>document.getElementById(id);
const icon=name=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seeds=[
 {id:'web-admin',key:'admin',branch:'dev',branches:['dev','feat-iam','master','ref-v1','upgrade-antdv-next','upgrade-tailwind-v4','upgrade-vite8'],color:'#8b6cc7',bg:'#f1ecfa',letter:'A'},
 {id:'web-bms',key:'bms',branch:'ref-FeeItemConfig',branches:['cost-quotes-antd-next','dev','feat-billCredit','feat-cost-quotes','feat-cost-quotes-antdv-next','feat-insight','master','ref-FeeItemConfig','ref-billdown-account','ref-maxSearchLines','ref-quotaLog','ref-quotationBill','ref-v1','ref-zoneJump','upgrade-antdv-next','upgrade-tailwind-v4','upgrade-vite8'],color:'#bb8847',bg:'#fbf2e6',letter:'B'},
 {id:'web-copilot',key:'copilot',branch:'dev',branches:['dev','master'],color:'#448e86',bg:'#eaf5f2',letter:'C'},
 {id:'web-tms',key:'tms',branch:'feat/optimize-waybill-dashboard',branches:['agent','dev','feat-costAcctGroup','feat-quotes','feat/optimize-waybill-dashboard','integration-carrierAcctGroup-antdv-next','master','ref-nation','ref-shipCodeGroup','ref-v1','upgrade-antdv-next','upgrade-tailwind-v4','upgrade-vite8'],color:'#5275ca',bg:'#edf2fd',letter:'T'}
];
let apps=structuredClone(seeds),selected=new Set(['web-bms','web-tms']),mode='selected',busy=false,scanning=false,activeRepo=null,task=null,pending=null;
const activityLogs=[];
const buildRuns=[];
let buildSequence=0,logView='session',logStart=0;
let openedBranch=null,refreshingBranch=null,branchError=false;
let connection={host:'demo@example.com',root:'/home/wwwroot/web-framework/current/'},toastTimer;
const statuses={preparing:'准备构建',waiting:'等待构建',running:'正在构建',success:'构建成功',failed:'构建失败',skipped:'未执行',groupFailed:'整批构建失败'};
const processStates={waiting:'等待执行',running:'执行中',success:'已完成',failed:'失败',skipped:'未执行'};
function latestProcess(id){for(const run of [...buildRuns].reverse()){const job=run.jobs.find(j=>j.ids.includes(id));if(job)return job;}return null;}
function logContext(){
 for(const run of buildRuns){if(logView===`task:${run.id}`)return {run,job:null,entries:run.logs};const job=run.jobs.find(j=>logView===`job:${j.id}`);if(job)return {run,job,entries:run.logs.filter(entry=>!entry.jobId||entry.jobId===job.id)};}
 return {run:null,job:null,entries:activityLogs};
}
function openLogs(view){logView=view;logStart=0;$('taskBody').innerHTML='';render();}
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3200);}
function notice(text){$('notice').textContent=text;$('notice').classList.toggle('show',Boolean(text));}
function isLocked(){return busy||scanning||Boolean(activeRepo);}
function visibleApps(){const query=$('searchInput').value.toLowerCase().trim();return apps.filter(a=>`${a.id} ${a.branch}`.toLowerCase().includes(query));}
function chosen(){return apps.filter(a=>mode==='all'||selected.has(a.id));}
function allScope(items){return items.length>0&&items.length===apps.length;}
function commands(items){return allScope(items)?['pnpm build:dev']:items.map(a=>`pnpm build:dev:${a.key}`);}
function commandHTML(items){return `<div class="command-line clean"><span class="prompt">$</span>rm -rf -- ./.turbo</div>${commands(items).map(cmd=>`<div class="command-line"><span class="prompt">$</span>${escape(cmd)}</div>`).join('')}`;}
function render(){
 $('hostLabel').textContent=connection.host;$('rootLabel').textContent=connection.root;$('rootLabel').title=connection.root;
 const visible=visibleApps(),locked=isLocked();
 $('repoCount').textContent=apps.length;
 $('repoRows').innerHTML=visible.map(a=>{const process=latestProcess(a.id);return `<tr class="${selected.has(a.id)||mode==='all'?'selected':''}" data-repo="${a.id}">
 <td><input class="checkbox repo-check" type="checkbox" data-id="${a.id}" aria-label="选择 ${a.id}" ${selected.has(a.id)||mode==='all'?'checked':''} ${locked?'disabled':''}></td>
 <td><div class="repo-id" title="apps/${a.id}"><span class="project-icon" style="background:${a.bg};color:${a.color}">${a.letter}</span><div class="project-name">${a.id}</div></div></td>
 <td><div class="branch-cell"><div class="branch-current" title="${escape(a.branch)}">${icon('branch')}<span class="truncate">${escape(a.branch)}</span></div><span class="row-status ${a.status||''}">${activeRepo===a.id?'操作中…':statuses[a.status]||''}</span></div></td>
 <td><button class="target-select branch-trigger" data-id="${a.id}" role="combobox" aria-label="${a.id} 目标分支" aria-haspopup="listbox" aria-expanded="${openedBranch===a.id}" ${openedBranch===a.id?'aria-controls="branchList"':''} title="${escape(a.target||'选择目标分支')}" ${locked&&refreshingBranch!==a.id?'disabled':''}><span>${escape(a.target||'选择目标分支')}</span></button></td>
 <td><div class="row-actions"><button class="btn btn-subtle" data-action="switch" data-id="${a.id}" ${locked||!a.target||a.target===a.branch?'disabled':''}>切换</button><button class="btn btn-subtle" data-action="pull" data-id="${a.id}" ${locked?'disabled':''}>Pull</button><button class="btn action-build" data-action="build" data-id="${a.id}" ${locked?'disabled':''}>打包</button><button class="btn log-button ${process&&logView===`job:${process.id}`?'active':''}" data-action="logs" data-id="${a.id}" aria-pressed="${Boolean(process&&logView===`job:${process.id}`)}" title="${process?'查看最近一次打包日志'+(process.ids.length>1?'（全部项目共享进程）':''):'尚无打包任务'}" ${process?'':'disabled'}>查看日志</button></div></td></tr>`;}).join('');
 $('emptyRepos').hidden=Boolean(visible.length);$('emptyTitle').textContent=apps.length?'没有匹配的项目':'尚未扫描业务仓库';
 const allVisible=visible.length>0&&visible.every(a=>mode==='all'||selected.has(a.id));
 $('selectVisible').checked=allVisible;$('selectVisible').indeterminate=!allVisible&&visible.some(a=>selected.has(a.id));$('selectVisible').disabled=locked||!visible.length;
 $('scanButton').disabled=busy||Boolean(activeRepo)||scanning;$('settingsButton').disabled=locked;
 $('scanText').textContent=scanning?'扫描中…':'重新扫描';
 const items=chosen(),all=allScope(items);
 $('tableNote').textContent=`已选 ${items.length} / ${apps.length}`;
 $('buildSelected').disabled=locked||!items.length;$('buildButtonText').textContent=busy?'正在构建…':'批量构建';
 $('buildSelected').title=all?'构建全部项目：pnpm build:dev':`构建选定项目：${commands(items).join(' → ')}`;
 $('clearSelection').disabled=locked||!items.length;
 $('selectAll').disabled=locked||!apps.length;
 $('appStatus').textContent=busy?'正在构建 · 仓库操作已锁定':scanning?'正在扫描业务仓库…':activeRepo?'正在操作仓库…':`就绪 · ${apps.length} 个业务仓库`;
 renderTask();
 renderBranchPopup();
}
function branchTrigger(id){return document.querySelector(`.branch-trigger[data-id="${id}"]`);}
function positionBranchPopup(){
 const trigger=branchTrigger(openedBranch);if(!trigger){closeBranches();return;}
 const rect=trigger.getBoundingClientRect(),popup=$('branchPopup');
 popup.style.left=Math.min(rect.left,innerWidth-popup.offsetWidth-12)+'px';
 popup.style.top=(rect.bottom+6+popup.offsetHeight>innerHeight-12?Math.max(12,rect.top-popup.offsetHeight-6):rect.bottom+6)+'px';
}
function renderBranchPopup(){
 const popup=$('branchPopup'),app=apps.find(a=>a.id===openedBranch);popup.hidden=!app;if(!app)return;
 popup.innerHTML=refreshingBranch===app.id?'<div id="branchList" role="listbox" aria-label="分支" aria-busy="true"><div class="branch-popup-state" role="status">刷新中…</div></div>':branchError?'<div id="branchList" role="listbox" aria-label="分支"><div class="branch-popup-state error"><span role="alert">刷新失败</span><button class="btn" id="retryBranches">重试</button></div></div>':`<div class="branch-list" id="branchList" role="listbox" aria-label="${app.id} 分支">${app.branches.map(branch=>`<button class="branch-option" role="option" tabindex="-1" data-value="${escape(branch)}" aria-selected="${branch===app.target}" title="${escape(branch)}">${escape(branch)}</button>`).join('')}</div>`;
 positionBranchPopup();
}
function closeBranches(focus=false){const id=openedBranch;openedBranch=null;$('branchPopup').hidden=true;const trigger=branchTrigger(id);if(trigger){trigger.setAttribute('aria-expanded','false');trigger.removeAttribute('aria-controls');if(focus)trigger.focus();}}
async function openBranches(id){
 if(openedBranch===id){closeBranches(true);return;}if(isLocked())return;
 openedBranch=id;branchError=false;await refreshBranches(id);
}
async function refreshBranches(id){
 if(isLocked())return;const app=apps.find(a=>a.id===id);if(!app)return;
 refreshingBranch=id;activeRepo=id;branchError=false;const fail=$('scenario').value==='branch-error';render();
 log(`[${id}] 刷新分支列表`,'highlight');await sleep(650);
 if(fail){branchError=true;log(`[${id}] 分支刷新失败`,'error');}
 else{app.branches=[...seeds.find(a=>a.id===id).branches];if(app.target&&!app.branches.includes(app.target))app.target='';log(`[${id}] 分支列表已刷新 · ${app.branches.length} 个分支`,'success');}
 refreshingBranch=null;activeRepo=null;render();
 if(openedBranch===id){if(fail)$('retryBranches').focus();else{$('branchPopup').querySelector('[aria-selected="true"]')?.focus();if(!app.target)$('branchPopup').querySelector('[role="option"]')?.focus();}}
}
function renderTask(){
 const {run,job,entries}=logContext();
 const options='<option value="session">当前会话 · 全部输出</option>'+[...buildRuns].reverse().map(r=>`<optgroup label="${r.id} · ${r.started}"><option value="task:${r.id}">本批全部日志 · ${r.apps.length} 个项目</option>${r.jobs.map(j=>`<option value="job:${j.id}">${escape(j.name)} · ${processStates[j.state]}</option>`).join('')}</optgroup>`).join('');
 if($('logSource').innerHTML!==options)$('logSource').innerHTML=options;$('logSource').value=logView;
 $('taskMeta').hidden=!run;
 $('taskMeta').innerHTML=run?`${escape(job?job.id:run.id)} · ${run.started}${job?`<code>${escape(job.command)}</code>${job.ids.length>1?'全部项目共享进程':'构建分支：'+escape(run.apps.find(a=>a.id===job.ids[0]).branch)} · ${job.started?(job.duration?'耗时 '+job.duration+' 秒':'执行中'):'尚未启动构建进程'}`:` · ${run.state==='running'?escape(run.phase):run.duration+' 秒'}`}`:'';
 const state=job?.state||run?.state|| (scanning?'scanning':busy?'running':'ready');
 $('logState').textContent=job?processStates[state]:({running:'执行中',success:'已完成',failed:'未完成',scanning:'扫描中',ready:'就绪'}[state]);$('logState').className='task-state '+state;
 const scroll=$('logOutput')?.scrollTop||0;
 const shown=entries.slice(logStart);
 $('taskBody').innerHTML=shown.length?`<div class="log-output" id="logOutput">${shown.map(l=>`<div class="log-line ${l.type}"><span class="time">${l.time}</span>${escape(l.text)}</div>`).join('')}</div>`:`<div class="log-empty">&gt;_ ${logStart?'当前显示已清空':'等待输出'}</div>`;
 $('retryTask').hidden=task?.state!=='failed';$('retryTask').disabled=isLocked();
 if(task?.state==='failed'){$('retryTask').textContent=task.all||task.jobs.every(j=>j.state==='skipped')?'重试本次构建':'重试未完成项目';$('retryTask').onclick=()=>{const unfinished=task.jobs.filter(j=>j.state==='failed'||j.state==='skipped').flatMap(j=>j.ids);review(apps.filter(a=>unfinished.includes(a.id)));};}
 if($('logOutput'))$('logOutput').scrollTop=$('autoScroll').checked?$('logOutput').scrollHeight:scroll;
}
function log(text,type='',job=null){const entry={text,type,jobId:job?.id||null,time:new Date().toLocaleTimeString('zh-CN',{hour12:false})};activityLogs.push(entry);if(busy&&task)task.logs.push(entry);renderTask();}
async function scan(announce=true){
 if(isLocked())return;scanning=true;notice('');$('snapshotLabel').textContent='正在扫描 apps/…';render();log('[scan] 正在扫描工作区 apps/…');await sleep(950);
 if($('scenario').value==='scan-error'){notice('扫描失败：无法读取远端 apps/。已保留现有仓库与选择，请检查连接后重试。');log('[scan] 读取 apps/ 失败，保留上次结果。','error');$('snapshotLabel').textContent='扫描失败 · 保留上次结果';scanning=false;render();return;}
 const previous=new Map(apps.map(a=>[a.id,a]));apps=structuredClone(seeds).map(a=>({...a,...previous.get(a.id)}));selected=new Set([...selected].filter(id=>apps.some(a=>a.id===id)));scanning=false;$('snapshotLabel').textContent='刚刚完成扫描';apps.forEach(a=>log(`[scan] ${a.id} · ${a.branch}`));log('[scan] 发现 4 个可用仓库，构建脚本均已匹配。','success');render();if(announce)toast('扫描完成，发现 4 个可用仓库，构建脚本均已匹配');
}
async function repoAction(id,action){
  const app=apps.find(a=>a.id===id);if(!app)return;if(action==='logs'){const job=latestProcess(id);if(job)openLogs(`job:${job.id}`);return;}
  if(isLocked())return;if(action==='build'){review([app]);return;}if(!['switch','pull'].includes(action))return;
 if(action==='switch'&&(!app.target||app.target===app.branch))return;
 activeRepo=id;render();log(`[${id}] ${action==='switch'?'git checkout '+app.target:'git pull'}`,'highlight');await sleep(650);
 if(action==='switch'){app.branch=app.target;app.target='';app.status=undefined;toast(`${id} 已切换至 ${app.branch}（模拟 git checkout）`);}
 if(action==='pull'){app.status=undefined;toast(`${id} 当前分支 ${app.branch} 已更新（模拟 git pull）`);}
 log(`[${id}] 操作成功 · 当前分支 ${app.branch}`,'success');activeRepo=null;render();
}
function review(items){
 if(isLocked()||!items.length)return;
 pending=structuredClone(items);$('reviewProjects').innerHTML=pending.map(a=>`<div class="review-item"><strong>${escape(a.id)}</strong><code class="truncate" title="${escape(a.branch)}">${escape(a.branch)}</code></div>`).join('');
 $('reviewCommands').innerHTML=commandHTML(pending);$('reviewTitle').textContent=allScope(pending)?'确认构建全部项目':`确认构建 ${pending.length} 个项目`;$('reviewDialog').showModal();
}
async function startBuild(){
 if(!pending||isLocked())return;const items=pending;pending=null;$('reviewDialog').close();busy=true;notice('');const all=allScope(items),scenario=$('scenario').value,start=performance.now();
  task={id:'BUILD-'+String(++buildSequence).padStart(3,'0'),started:new Date().toLocaleTimeString('zh-CN',{hour12:false}),apps:items,all,state:'running',phase:'校验仓库分支',logs:[],jobs:all?[{name:`全部项目（${items.length}）· 共享进程`,ids:items.map(a=>a.id),command:'pnpm build:dev',state:'waiting'}]:items.map(a=>({name:a.id,ids:[a.id],command:`pnpm build:dev:${a.key}`,state:'waiting'}))};
  task.jobs.forEach((job,i)=>job.id=`${task.id}/P${i+1}`);buildRuns.push(task);logView=`task:${task.id}`;logStart=0;
  items.forEach(a=>{apps.find(p=>p.id===a.id).status='preparing';});render();
 log(`[workspace] ${connection.root}`,'highlight');log(`[preflight] 校验 ${items.length} 个仓库的当前分支`);
 await sleep(650);for(const a of items)log(`[branch] apps/${a.id} → ${a.branch}`);
 task.phase='清理工作区缓存';log('[clean-turbo] rm -rf -- ./.turbo');await sleep(750);
 if(scenario==='clean-error'){
   log('rm: cannot remove ./.turbo: Permission denied','error');log('[clean-turbo] exit=1，停止构建；全部构建命令未执行。','error');task.jobs.forEach(j=>{j.state='skipped';j.ids.forEach(id=>apps.find(a=>a.id===id).status='skipped');});finishBuild(false,start);return;
 }
  log('[clean-turbo] 缓存清理完成','success');items.forEach(a=>apps.find(p=>p.id===a.id).status='waiting');
 for(let i=0;i<task.jobs.length;i++){
   const job=task.jobs[i],jobStart=performance.now();job.state='running';job.started=new Date().toLocaleTimeString('zh-CN',{hour12:false});task.phase=job.name;job.ids.forEach(id=>{apps.find(a=>a.id===id).status='running';});render();log(`$ ${job.command}`,'highlight',job);await sleep(700);log(all?'turbo · 开始构建工作区全部应用':`turbo · build --filter=@repo/${items[i].key}`,'',job);await sleep(700);
  if(scenario==='build-error'&&(all||i===Math.min(1,task.jobs.length-1))){
   job.state='failed';job.duration=((performance.now()-jobStart)/1000).toFixed(1);job.ids.forEach(id=>{apps.find(a=>a.id===id).status=all?'groupFailed':'failed';});
    log(`[build] ${job.command} exit=1，${all?'整批构建失败，单项目结果请查看输出':'后续项目不再执行'}`,'error',job);task.jobs.slice(i+1).forEach(j=>{j.state='skipped';j.ids.forEach(id=>apps.find(a=>a.id===id).status='skipped');log(`[skip] ${j.name} 未执行：前序进程失败。`,'error',j);});finishBuild(false,start);return;
  }
   job.state='success';job.duration=((performance.now()-jobStart)/1000).toFixed(1);job.ids.forEach(id=>{apps.find(a=>a.id===id).status='success';});log(`[build] ${job.command} exit=0`,'success',job);render();
 }
 log('[done] 构建完成，产物保留在服务器。','success');finishBuild(true,start);
}
function finishBuild(ok,start){task.state=ok?'success':'failed';task.duration=((performance.now()-start)/1000).toFixed(1);busy=false;render();toast(ok?'构建完成（演示）':'任务未完成，请查看右侧日志');}
$('repoRows').addEventListener('change',e=>{
 if(e.target.matches('.repo-check')){if(mode==='all')selected=new Set(apps.map(a=>a.id));mode='selected';e.target.checked?selected.add(e.target.dataset.id):selected.delete(e.target.dataset.id);render();}
});
$('repoRows').addEventListener('click',e=>{const trigger=e.target.closest('.branch-trigger');if(trigger){openBranches(trigger.dataset.id);return;}const button=e.target.closest('[data-action]');if(button){closeBranches();repoAction(button.dataset.id,button.dataset.action);}});
$('branchPopup').addEventListener('click',e=>{if(e.target.closest('#retryBranches')){refreshBranches(openedBranch);return;}const option=e.target.closest('[role="option"]');if(!option||refreshingBranch)return;const id=openedBranch;apps.find(a=>a.id===id).target=option.dataset.value;closeBranches();render();branchTrigger(id)?.focus();});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.branch-trigger, #branchPopup'))closeBranches();});
document.addEventListener('keydown',e=>{
 if(e.target.matches('.branch-trigger')&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();if(!openedBranch)openBranches(e.target.dataset.id);else $('branchPopup').querySelector('[role="option"]')?.focus();return;}
 if(!openedBranch)return;if(e.key==='Escape'){e.preventDefault();closeBranches(true);return;}if(e.key==='Tab'){closeBranches(true);return;}
 const options=[...$('branchPopup').querySelectorAll('[role="option"]')],index=options.indexOf(document.activeElement);
 if(index<0)return;let next;if(e.key==='ArrowDown')next=(index+1)%options.length;else if(e.key==='ArrowUp')next=(index-1+options.length)%options.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=options.length-1;else return;e.preventDefault();options[next].focus();
});
window.addEventListener('resize',()=>{if(openedBranch)positionBranchPopup();});
document.querySelector('.table-scroll').addEventListener('scroll',()=>{if(openedBranch)positionBranchPopup();});
$('selectVisible').onchange=e=>{if(mode==='all')selected=new Set(apps.map(a=>a.id));mode='selected';visibleApps().forEach(a=>e.target.checked?selected.add(a.id):selected.delete(a.id));render();};
$('searchInput').oninput=render;
$('selectAll').onclick=()=>{mode='selected';selected=new Set(apps.map(a=>a.id));render();};
$('clearSelection').onclick=()=>{mode='selected';selected.clear();render();};
$('scanButton').onclick=scan;$('buildSelected').onclick=()=>review(chosen());$('confirmBuild').onclick=startBuild;
$('clearLogs').onclick=()=>{logStart=logContext().entries.length;renderTask();};
$('logSource').onchange=e=>openLogs(e.target.value);
document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>$(button.dataset.close).close());
$('settingsButton').onclick=()=>{$('hostInput').value=connection.host;$('rootInput').value=connection.root;$('settingsDialog').showModal();};
 $('settingsForm').onsubmit=e=>{e.preventDefault();const host=$('hostInput').value.trim(),root=$('rootInput').value.trim();if(host.startsWith('-')){$('hostInput').setCustomValidity('SSH 地址不能以 - 开头');$('hostInput').reportValidity();return;}if(host!==connection.host||root!==connection.root){connection={host,root};apps=[];selected.clear();mode='selected';task=null;buildRuns.length=0;activityLogs.length=0;logView='session';logStart=0;$('snapshotLabel').textContent='等待重新扫描';} $('settingsDialog').close();render();scan();};
$('hostInput').oninput=()=> $('hostInput').setCustomValidity('');
render();scan(false);
</script>
</body>
